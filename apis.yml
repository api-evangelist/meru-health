description: 'Meru Health is a digital mental health company delivering a therapist-guided 12-week program
  for anxiety, depression, stress, and burnout. The platform blends licensed-therapist video sessions,
  an on-demand app of mindfulness and behavioral practices, an HRV biofeedback wearable, and anonymous
  peer support. Sold B2B2C to health plans and employers as a covered benefit, it is measurement-based
  and outcomes-focused. No public developer API, portal, SDK, or documentation surface was found during
  enrichment; this profile captures the company identity plus a probed domain-security posture.'
